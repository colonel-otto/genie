[package]
name = "genie-core"
version = "0.1.0"
description = "Deterministic simulation core of the genie Age of Empires II: Definitive Edition engine"
edition = "2024"
license = "AGPL-3.0-only"
repository.workspace = true

[dependencies]
# floorf, which the game imports from the CRT (api-ms-win-crt-math): an exact operation, so libm's
# gives its bits (src/facing.rs); the image's own math routines are ported in src/fmath.rs, and
# tests/crt_math.rs's ignored sweeps check them against libm
libm = "0.2"
# what the engine tells a subscriber while it runs (src/trace.rs); the binaries install one
tracing.workspace = true

[lints]
workspace = true
