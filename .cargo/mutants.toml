# cargo-mutants (mutation testing, https://mutants.rs): a mutant the tests do not catch marks
# code whose tests check too little. CI runs the mutants of each change
# (.github/workflows/mutants.yml); a whole crate runs by hand: `cargo mutants -p CRATE`.

# The tests run under nextest, as everywhere in genie (.config/nextest.toml).
test_tool = "nextest"

# Generated code is checked by its generator's tests and the round trips over the recordings.
exclude_globs = ["**/generated.rs", "**/generated/**"]
